<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Stick Fury</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,Arial,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#000;touch-action:none}
#touch{position:fixed;inset:0;pointer-events:none}
#touch.hide{display:none}
#touch button{pointer-events:auto;position:absolute;border:3px solid rgba(255,255,255,.55);background:rgba(15,18,30,.45);color:#fff;font:bold 15px system-ui,Arial,sans-serif;border-radius:50%;touch-action:none;padding:0;outline:none;-webkit-user-select:none;user-select:none}
#touch button.on{background:rgba(255,200,40,.65);border-color:#fff}
#touch button.rage{border-color:#7df;color:#7df}
#touch button.rage.ready{background:rgba(60,200,255,.6);color:#fff;animation:pulse .6s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.12)}}
#bl{left:18px;bottom:22px;width:86px;height:86px;font-size:30px!important}
#br{left:118px;bottom:22px;width:86px;height:86px;font-size:30px!important}
#bj{right:150px;bottom:20px;width:84px;height:84px}
#ba{right:22px;bottom:24px;width:112px;height:112px;font-size:18px!important}
#bs{right:24px;bottom:150px;width:66px;height:66px;font-size:13px!important}
#bx{right:112px;bottom:118px;width:74px;height:74px;font-size:14px!important}
#rot{display:none;position:fixed;inset:0;background:#0b0e1a;color:#fff;align-items:center;justify-content:center;text-align:center;font:bold 22px system-ui,Arial,sans-serif;z-index:9;padding:20px}
@media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch" class="hide">
  <button id="bl" data-k="left">&#9664;</button>
  <button id="br" data-k="right">&#9654;</button>
  <button id="bj" data-k="jump">JUMP</button>
  <button id="ba" data-k="atk">ATTACK</button>
  <button id="bs" data-k="swap">SWAP</button>
  <button id="bx" data-k="special" class="rage">RAGE</button>
</div>
<div id="rot">Rotate your phone to landscape<br>to play STICK FURY</div>
<script src="data.js"></script>
<script src="game.js"></script>
<script src="logic.js"></script>
<script src="render.js"></script>
</body>
</html>
